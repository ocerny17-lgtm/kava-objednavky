<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98a"/>
      <stop offset="0.45" stop-color="#f3b27a"/>
      <stop offset="1" stop-color="#e98f5c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.5" stop-color="#ffe0a3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5552a"/>
      <stop offset="1" stop-color="#6e3418"/>
    </linearGradient>

    <path id="leaf" d="M0,-10 C6,-6 8,2 0,10 C-8,2 -6,-6 0,-10 Z M0,-10 L0,12"/>

    <g id="treeOrange">
      <rect x="-7" y="-20" width="14" height="120" fill="#4a2c1a"/>
      <path d="M0,10 L-30,-40 M0,30 L28,-25" stroke="#4a2c1a" stroke-width="6" fill="none"/>
      <circle cx="0" cy="-70" r="62" fill="#e07a1f"/>
      <circle cx="-45" cy="-35" r="45" fill="#d4651a"/>
      <circle cx="45" cy="-35" r="48" fill="#ec8e2b"/>
      <circle cx="-20" cy="-110" r="40" fill="#f2a33a"/>
      <circle cx="28" cy="-100" r="38" fill="#e67d22"/>
    </g>
    <g id="treeRed">
      <rect x="-6" y="-20" width="12" height="110" fill="#3f2415"/>
      <circle cx="0" cy="-65" r="55" fill="#b8361e"/>
      <circle cx="-38" cy="-30" r="40" fill="#a32c1a"/>
      <circle cx="40" cy="-32" r="42" fill="#c94324"/>
      <circle cx="10" cy="-105" r="36" fill="#d4532b"/>
    </g>
    <g id="treeYellow">
      <rect x="-6" y="-10" width="12" height="100" fill="#4a2c1a"/>
      <ellipse cx="0" cy="-70" rx="48" ry="85" fill="#e8b23a"/>
      <ellipse cx="-18" cy="-55" rx="28" ry="55" fill="#d99a28"/>
      <ellipse cx="16" cy="-95" rx="22" ry="40" fill="#f4c955"/>
    </g>
    <g id="pine">
      <rect x="-5" y="-5" width="10" height="40" fill="#3a2414"/>
      <polygon points="0,-150 -45,-50 45,-50" fill="#3d5a3a"/>
      <polygon points="0,-110 -55,0 55,0" fill="#35503a"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="260" r="220" fill="url(#sun)"/>
  <circle cx="1180" cy="260" r="70" fill="#fff1cf" opacity="0.9"/>

  <!-- distant hills -->
  <path d="M0,560 C200,470 380,520 560,480 C760,430 940,520 1120,470 C1300,420 1460,480 1600,450 L1600,1000 L0,1000 Z" fill="#c9784a" opacity="0.55"/>
  <g opacity="0.6">
    <use href="#pine" xlink:href="#pine" transform="translate(140 560) scale(0.45)"/>
    <use href="#pine" xlink:href="#pine" transform="translate(190 555) scale(0.38)"/>
    <use href="#treeOrange" xlink:href="#treeOrange" transform="translate(420 520) scale(0.4)"/>
    <use href="#pine" xlink:href="#pine" transform="translate(700 500) scale(0.42)"/>
    <use href="#treeRed" xlink:href="#treeRed" transform="translate(880 520) scale(0.4)"/>
    <use href="#pine" xlink:href="#pine" transform="translate(1380 480) scale(0.45)"/>
    <use href="#pine" xlink:href="#pine" transform="translate(1430 485) scale(0.38)"/>
  </g>

  <!-- middle hills -->
  <path d="M0,680 C220,600 420,660 640,620 C860,580 1040,670 1260,620 C1420,585 1520,610 1600,600 L1600,1000 L0,1000 Z" fill="#b5602f"/>
  <use href="#treeYellow" xlink:href="#treeYellow" transform="translate(90 650) scale(0.75)"/>
  <use href="#treeOrange" xlink:href="#treeOrange" transform="translate(330 660) scale(0.7)"/>
  <use href="#pine" xlink:href="#pine" transform="translate(560 630) scale(0.7)"/>
  <use href="#treeRed" xlink:href="#treeRed" transform="translate(1050 650) scale(0.7)"/>
  <use href="#treeYellow" xlink:href="#treeYellow" transform="translate(1320 615) scale(0.7)"/>
  <use href="#treeOrange" xlink:href="#treeOrange" transform="translate(1520 620) scale(0.75)"/>

  <!-- cottage -->
  <g transform="translate(760 640)">
    <rect x="-70" y="-60" width="140" height="80" fill="#7a4a2a"/>
    <path d="M-70,-45 H70 M-70,-30 H70 M-70,-15 H70 M-70,0 H70" stroke="#5e3820" stroke-width="2"/>
    <polygon points="-90,-58 0,-120 90,-58" fill="#4b2a1c"/>
    <rect x="35" y="-125" width="16" height="40" fill="#5e3820"/>
    <rect x="-45" y="-40" width="26" height="24" fill="#ffd27a"/>
    <rect x="20" y="-40" width="26" height="24" fill="#ffd27a"/>
    <rect x="-10" y="-30" width="22" height="50" fill="#3f2415"/>
    <g fill="#f3e3d0" opacity="0.6">
      <circle cx="43" cy="-140" r="9"><animate attributeName="cy" values="-140;-200" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="48" cy="-160" r="12"><animate attributeName="cy" values="-160;-230" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- foreground -->
  <path d="M0,820 C260,760 520,800 800,780 C1080,760 1340,800 1600,770 L1600,1000 L0,1000 Z" fill="url(#ground)"/>
  <use href="#treeRed" xlink:href="#treeRed" transform="translate(130 800) scale(1.25)"/>
  <use href="#treeOrange" xlink:href="#treeOrange" transform="translate(1440 790) scale(1.35)"/>
  <use href="#treeYellow" xlink:href="#treeYellow" transform="translate(1250 800) scale(0.95)"/>

  <!-- leaves on the ground -->
  <g opacity="0.9">
    <use href="#leaf" xlink:href="#leaf" fill="#f2a33a" transform="translate(300 880) rotate(40)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#c94324" transform="translate(420 910) rotate(-30)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#e8b23a" transform="translate(560 870) rotate(80)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#e07a1f" transform="translate(680 940) rotate(10)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#b8361e" transform="translate(900 900) rotate(-60)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#f2a33a" transform="translate(1020 950) rotate(120)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#e8b23a" transform="translate(1110 880) rotate(-15)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#d4532b" transform="translate(240 960) rotate(70)"/>
    <use href="#leaf" xlink:href="#leaf" fill="#e07a1f" transform="translate(800 970) rotate(-100)"/>
  </g>

  <!-- falling leaves -->
  <g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#e07a1f" transform="scale(1.4)"/>
      <animateMotion dur="14s" repeatCount="indefinite" path="M200,-40 C260,200 120,400 240,620 S180,900 220,1040" rotate="auto"/></g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#c94324" transform="scale(1.2)"/>
      <animateMotion dur="17s" begin="3s" repeatCount="indefinite" path="M520,-40 C440,220 600,420 500,640 S580,900 520,1040" rotate="auto"/></g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#e8b23a" transform="scale(1.3)"/>
      <animateMotion dur="15s" begin="6s" repeatCount="indefinite" path="M900,-40 C980,200 840,440 960,660 S900,900 940,1040" rotate="auto"/></g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#d4651a" transform="scale(1.5)"/>
      <animateMotion dur="18s" begin="1s" repeatCount="indefinite" path="M1260,-40 C1180,240 1340,460 1240,680 S1320,900 1280,1040" rotate="auto"/></g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#b8361e" transform="scale(1.1)"/>
      <animateMotion dur="16s" begin="8s" repeatCount="indefinite" path="M1500,-40 C1560,220 1420,420 1520,640 S1460,900 1500,1040" rotate="auto"/></g>
    <g><use href="#leaf" xlink:href="#leaf" fill="#f2a33a" transform="scale(1.2)"/>
      <animateMotion dur="19s" begin="10s" repeatCount="indefinite" path="M60,-40 C120,260 0,460 100,700 S40,920 80,1040" rotate="auto"/></g>
  </g>
</svg>
